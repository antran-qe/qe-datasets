<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Image Generation Dataset</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f5f5;
            color: #333;
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #2c3e50;
            font-size: 2.5em;
        }

        .dataset-item {
            background: white;
            border-radius: 12px;
            margin-bottom: 30px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            transition: transform 0.2s ease;
        }

        .dataset-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
        }

        .item-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
        }

        .item-id {
            font-size: 1.5em;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .item-description {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .item-content {
            padding: 20px;
        }

        .prompt-section {
            margin-bottom: 20px;
        }

        .prompt-label {
            font-weight: bold;
            margin-bottom: 10px;
            color: #2c3e50;
            font-size: 1.1em;
        }

        .prompt-code {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 8px;
            padding: 15px;
            font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
            font-size: 14px;
            white-space: pre-wrap;
            word-wrap: break-word;
            text-align: left;
            position: relative;
            margin-bottom: 10px;
            cursor: pointer;
            transition: background-color 0.2s ease;
            padding-right: 45px; /* Add space for the icon */
        }

        .prompt-code:hover {
            background: #e9ecef;
        }

        .prompt-container {
            position: relative;
        }

        .prompt-copy-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            border: none;
            border-radius: 4px;
            padding: 8px;
            cursor: pointer;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 5px;
            opacity: 0;
            transition: opacity 0.2s ease;
            z-index: 10;
        }

        .prompt-container:hover .prompt-copy-btn {
            opacity: 1;
        }

        .images-section {
            display: flex;
            gap: 20px;
            align-items: flex-start;
        }

        .image-panel {
            flex: 1;
            text-align: center;
        }

        .image-label {
            font-weight: bold;
            margin-bottom: 10px;
            color: #2c3e50;
            font-size: 1.1em;
        }

        .image-container {
            position: relative;
            display: inline-block;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .dataset-image {
            max-width: 100%;
            max-height: 600px;
            width: auto;
            height: auto;
            display: block;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .dataset-image:hover {
            transform: scale(1.02);
        }

        .image-copy-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            border: none;
            border-radius: 4px;
            padding: 8px;
            cursor: pointer;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 5px;
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        .image-download-btn {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            border: none;
            border-radius: 4px;
            padding: 8px;
            cursor: pointer;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 5px;
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        .image-container:hover .image-copy-btn,
        .image-container:hover .image-download-btn {
            opacity: 1;
        }

        .no-input {
            color: #6c757d;
            font-style: italic;
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
        }

        .copy-icon {
            width: 14px;
            height: 14px;
        }

        .error-message {
            color: #dc3545;
            text-align: center;
            padding: 20px;
            background: #f8d7da;
            border-radius: 8px;
            margin: 20px 0;
        }

        @media (max-width: 768px) {
            .images-section {
                flex-direction: column;
            }
            
            .container {
                padding: 10px;
            }
            
            h1 {
                font-size: 2em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>AI Image Generation Dataset</h1>
        <div id="dataset-container">
            <p>Loading dataset...</p>
        </div>
    </div>

    <script>
        // Copy icon SVG
        const copyIconSVG = `
            <svg class="copy-icon" viewBox="0 0 24 24" fill="currentColor">
                <path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/>
            </svg>
        `;

        // Small copy icon SVG
        const copyIconSmallSVG = `
            <svg class="copy-icon-small" viewBox="0 0 24 24" fill="currentColor">
                <path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/>
            </svg>
        `;

        // Download icon SVG
        const downloadIconSVG = `
            <svg class="copy-icon" viewBox="0 0 24 24" fill="currentColor">
                <path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/>
            </svg>
        `;

        // Function to copy text to clipboard
        async function copyToClipboard(text) {
            try {
                await navigator.clipboard.writeText(text);
                // Show a brief visual feedback
                const notification = document.createElement('div');
                notification.style.cssText = `
                    position: fixed;
                    top: 20px;
                    right: 20px;
                    background: #28a745;
                    color: white;
                    padding: 10px 15px;
                    border-radius: 4px;
                    z-index: 1000;
                    font-size: 14px;
                `;
                notification.textContent = 'Prompt copied to clipboard!';
                document.body.appendChild(notification);
                
                setTimeout(() => {
                    document.body.removeChild(notification);
                }, 2000);
            } catch (err) {
                console.error('Failed to copy text: ', err);
                alert('Failed to copy to clipboard');
            }
        }

        // Function to download image
        async function downloadImage(imageSrc, filename) {
            try {
                const response = await fetch(imageSrc);
                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);
                
                const a = document.createElement('a');
                a.href = url;
                a.download = filename || imageSrc.split('/').pop();
                document.body.appendChild(a);
                a.click();
                window.URL.revokeObjectURL(url);
                document.body.removeChild(a);
                
                // Show notification
                const notification = document.createElement('div');
                notification.style.cssText = `
                    position: fixed;
                    top: 20px;
                    right: 20px;
                    background: #007bff;
                    color: white;
                    padding: 10px 15px;
                    border-radius: 4px;
                    z-index: 1000;
                    font-size: 14px;
                `;
                notification.textContent = 'Image downloaded!';
                document.body.appendChild(notification);
                
                setTimeout(() => {
                    document.body.removeChild(notification);
                }, 2000);
            } catch (err) {
                console.error('Failed to download image: ', err);
                alert('Failed to download image');
            }
        }

        // Function to copy image to clipboard
        async function copyImageToClipboard(imageSrc) {
            try {
                const response = await fetch(imageSrc);
                const blob = await response.blob();
                await navigator.clipboard.write([
                    new ClipboardItem({ [blob.type]: blob })
                ]);
                
                // Show notification
                const notification = document.createElement('div');
                notification.style.cssText = `
                    position: fixed;
                    top: 20px;
                    right: 20px;
                    background: #28a745;
                    color: white;
                    padding: 10px 15px;
                    border-radius: 4px;
                    z-index: 1000;
                    font-size: 14px;
                `;
                notification.textContent = 'Image copied to clipboard!';
                document.body.appendChild(notification);
                
                setTimeout(() => {
                    document.body.removeChild(notification);
                }, 2000);
            } catch (err) {
                console.error('Failed to copy image: ', err);
                alert('Failed to copy image to clipboard');
            }
        }

        // Function to render dataset
        function renderDataset(data) {
            const container = document.getElementById('dataset-container');
            
            if (!data || data.length === 0) {
                container.innerHTML = '<div class="error-message">No data found in dataset.</div>';
                return;
            }

            const html = data.map(item => {
                const hasInput = item.input && item.input !== 'N/A';
                const cleanPrompting = item.prompting.trim(); // Remove any leading/trailing whitespace
                
                return `
                    <div class="dataset-item">
                        <div class="item-header">
                            <div class="item-id">${item.id}</div>
                            <div class="item-description">${item.description}</div>
                        </div>
                        <div class="item-content">
                            <div class="prompt-section">
                                <div class="prompt-label">Prompt:</div>
                                <div class="prompt-container">
                                    <div class="prompt-code" onclick="copyToClipboard(\`${cleanPrompting.replace(/`/g, '\\`').replace(/\\/g, '\\\\')}\`)">${cleanPrompting}</div>
                                    <button class="prompt-copy-btn" onclick="event.stopPropagation(); copyToClipboard(\`${cleanPrompting.replace(/`/g, '\\`').replace(/\\/g, '\\\\')}\`)">
                                        ${copyIconSVG}
                                    </button>
                                </div>
                            </div>
                            <div class="images-section">
                                <div class="image-panel">
                                    <div class="image-label">Input</div>
                                    ${hasInput ? `
                                        <div class="image-container">
                                            <img src="${item.input}" alt="Input for ${item.id}" class="dataset-image" 
                                                 onclick="window.open(this.src, '_blank')">
                                            <button class="image-download-btn" onclick="downloadImage('${item.input}', '${item.id}_input')">
                                                ${downloadIconSVG}
                                            </button>
                                            <button class="image-copy-btn" onclick="copyImageToClipboard('${item.input}')">
                                                ${copyIconSVG}
                                            </button>
                                        </div>
                                    ` : `
                                        <div class="no-input">No input image (Text-to-Image)</div>
                                    `}
                                </div>
                                <div class="image-panel">
                                    <div class="image-label">Result</div>
                                    <div class="image-container">
                                        <img src="${item.result}" alt="Result for ${item.id}" class="dataset-image"
                                             onclick="window.open(this.src, '_blank')">
                                        <button class="image-copy-btn" onclick="copyImageToClipboard('${item.result}')">
                                            ${copyIconSVG}
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');

            container.innerHTML = html;
        }

        // Load and render the dataset
        async function loadDataset() {
            try {
                const response = await fetch('data_output.json');
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const data = await response.json();
                renderDataset(data);
            } catch (error) {
                console.error('Error loading dataset:', error);
                document.getElementById('dataset-container').innerHTML = 
                    `<div class="error-message">Error loading dataset: ${error.message}</div>`;
            }
        }

        // Load the dataset when the page loads
        document.addEventListener('DOMContentLoaded', loadDataset);
    </script>
</body>
</html>
