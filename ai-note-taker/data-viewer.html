<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Note Taker Dataset Viewer</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f5f5f5;
            line-height: 1.6;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            padding: 30px;
        }
        
        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 3px solid #007bff;
            padding-bottom: 10px;
        }
        
        .stats {
            display: flex;
            justify-content: space-around;
            margin-bottom: 30px;
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
        }
        
        .stat-item {
            text-align: center;
        }
        
        .stat-number {
            font-size: 2em;
            font-weight: bold;
            color: #007bff;
        }
        
        .stat-label {
            color: #666;
            margin-top: 5px;
        }
        
        .filters {
            margin-bottom: 20px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
        }
        
        .filter-group {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        label {
            font-weight: 600;
            color: #333;
        }
        
        select, input {
            padding: 8px 12px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
        }
        
        select:focus, input:focus {
            outline: none;
            border-color: #007bff;
        }
        
        .dataset-grid {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-top: 20px;
        }
        
        .dataset-item {
            border: 2px solid #e9ecef;
            border-radius: 8px;
            padding: 20px;
            background: #fff;
            transition: all 0.3s ease;
        }
        
        .dataset-item:hover {
            border-color: #007bff;
            box-shadow: 0 4px 12px rgba(0,123,255,0.15);
        }
        
        .item-id {
            font-weight: bold;
            color: #007bff;
            font-size: 1.3em;
            margin-bottom: 15px;
            text-align: left;
            padding: 10px;
            background: #f8f9fa;
            border-radius: 6px;
        }
        
        .item-meta {
            display: flex;
            justify-content: flex-start;
            gap: 15px;
            margin-bottom: 15px;
        }
        
        .source-type {
            background: #28a745;
            color: white;
            padding: 6px 12px;
            border-radius: 15px;
            font-size: 0.9em;
            font-weight: 600;
        }
        
        .item-language {
            background: #007bff;
            color: white;
            padding: 6px 12px;
            border-radius: 15px;
            font-size: 0.9em;
            font-weight: 600;
        }
        
        .item-description {
            color: #333;
            margin-bottom: 15px;
            padding: 12px;
            background: #f8f9fa;
            border-radius: 6px;
            border-left: 4px solid #007bff;
        }
        
        .item-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 15px;
        }
        
        .preview-section {
            border: 1px solid #ddd;
            border-radius: 6px;
            padding: 15px;
            background: #fafafa;
        }
        
        .preview-header {
            display: flex;
            justify-content: between;
            align-items: center;
            margin-bottom: 10px;
        }
        
        .preview-title {
            font-weight: 600;
            color: #333;
            margin-bottom: 10px;
        }
        
        .copy-btn {
            background: #007bff;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8em;
            margin-left: 10px;
        }
        
        .copy-btn:hover {
            background: #0056b3;
        }
        
        .source-preview {
            margin-top: 10px;
        }
        
        .source-link {
            color: #007bff;
            text-decoration: none;
            font-size: 0.9em;
            word-break: break-all;
        }
        
        .source-link:hover {
            text-decoration: underline;
        }
        
        .preview-icon {
            width: 20px;
            height: 20px;
            margin-right: 8px;
            vertical-align: middle;
        }
        
        .summary-section {
            border: 1px solid #ddd;
            border-radius: 6px;
            padding: 15px;
            background: #fff3cd;
        }
        
        .summary-title {
            font-weight: 600;
            color: #333;
            margin-bottom: 10px;
        }
        
        .item-summary {
            color: #333;
            max-height: 200px;
            overflow-y: auto;
            border: 1px solid #ffeaa7;
            padding: 10px;
            border-radius: 4px;
            background: white;
        }
        
        .item-transcription {
            color: #333;
            font-size: 0.9em;
            background: #e8f5e8;
            padding: 15px;
            border-radius: 6px;
            border: 1px solid #c3e6c3;
            max-height: 200px;
            overflow-y: auto;
        }
        
        .transcription-title {
            font-weight: 600;
            color: #333;
            margin-bottom: 10px;
            background: #e8f5e8;
            padding: 10px 15px;
            border-radius: 6px 6px 0 0;
            border: 1px solid #c3e6c3;
            border-bottom: none;
        }
        
        .loading {
            text-align: center;
            padding: 50px;
            color: #666;
            font-size: 1.2em;
        }
        
        .error {
            text-align: center;
            padding: 50px;
            color: #dc3545;
            font-size: 1.2em;
            background: #f8d7da;
            border-radius: 8px;
            border: 1px solid #f5c6cb;
        }
        
        .no-results {
            text-align: center;
            padding: 50px;
            color: #666;
            font-size: 1.1em;
        }
        
        .toggle-content {
            cursor: pointer;
            color: #007bff;
            text-decoration: underline;
            font-size: 0.9em;
            margin-top: 5px;
        }
        
        .content-preview {
            max-height: 100px;
            overflow: hidden;
            position: relative;
        }
        
        .content-full {
            max-height: none;
        }
        
        .fade-out {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 30px;
            background: linear-gradient(transparent, white);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>AI Note Taker Dataset Viewer</h1>
        
        <div class="stats" id="stats">
            <div class="stat-item">
                <div class="stat-number" id="totalItems">0</div>
                <div class="stat-label">Total Items</div>
            </div>
            <div class="stat-item">
                <div class="stat-number" id="languageCount">0</div>
                <div class="stat-label">Languages</div>
            </div>
            <div class="stat-item">
                <div class="stat-number" id="sourceTypeCount">0</div>
                <div class="stat-label">Source Types</div>
            </div>
            <div class="stat-item">
                <div class="stat-number" id="withSummaryCount">0</div>
                <div class="stat-label">With Summary</div>
            </div>
        </div>
        
        <div class="filters">
            <div class="filter-group">
                <label for="languageFilter">Language:</label>
                <select id="languageFilter">
                    <option value="">All Languages</option>
                </select>
            </div>
            
            <div class="filter-group">
                <label for="sourceTypeFilter">Source Type:</label>
                <select id="sourceTypeFilter">
                    <option value="">All Types</option>
                </select>
            </div>
            
            <div class="filter-group">
                <label for="searchFilter">Search:</label>
                <input type="text" id="searchFilter" placeholder="Search in ID, description, summary...">
            </div>
        </div>
        
        <div id="content">
            <div class="loading">Loading dataset...</div>
        </div>
    </div>

    <script>
        let dataset = [];
        let filteredDataset = [];
        
        // Load the dataset
        async function loadDataset() {
            try {
                const response = await fetch('data_output.json');
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                dataset = await response.json();
                filteredDataset = [...dataset];
                
                updateStats();
                populateFilters();
                renderDataset();
            } catch (error) {
                document.getElementById('content').innerHTML = `
                    <div class="error">
                        Error loading dataset: ${error.message}
                        <br><br>
                        Make sure the data_output.json file is in the same directory as this HTML file.
                    </div>
                `;
            }
        }
        
        // Update statistics
        function updateStats() {
            const languages = [...new Set(dataset.map(item => item.language))];
            const sourceTypes = [...new Set(dataset.map(item => item.source_type))];
            const withSummary = dataset.filter(item => item.summary && item.summary.trim() !== '').length;
            
            document.getElementById('totalItems').textContent = dataset.length;
            document.getElementById('languageCount').textContent = languages.length;
            document.getElementById('sourceTypeCount').textContent = sourceTypes.length;
            document.getElementById('withSummaryCount').textContent = withSummary;
        }
        
        // Populate filter dropdowns
        function populateFilters() {
            const languages = [...new Set(dataset.map(item => item.language))].sort();
            const sourceTypes = [...new Set(dataset.map(item => item.source_type))].sort();
            
            const languageFilter = document.getElementById('languageFilter');
            const sourceTypeFilter = document.getElementById('sourceTypeFilter');
            
            languages.forEach(lang => {
                const option = document.createElement('option');
                option.value = lang;
                option.textContent = lang;
                languageFilter.appendChild(option);
            });
            
            sourceTypes.forEach(type => {
                const option = document.createElement('option');
                option.value = type;
                option.textContent = type.toUpperCase();
                sourceTypeFilter.appendChild(option);
            });
        }
        
        // Apply filters
        function applyFilters() {
            const languageFilter = document.getElementById('languageFilter').value;
            const sourceTypeFilter = document.getElementById('sourceTypeFilter').value;
            const searchFilter = document.getElementById('searchFilter').value.toLowerCase();
            
            filteredDataset = dataset.filter(item => {
                const matchesLanguage = !languageFilter || item.language === languageFilter;
                const matchesSourceType = !sourceTypeFilter || item.source_type === sourceTypeFilter;
                const matchesSearch = !searchFilter || 
                    item.id.toLowerCase().includes(searchFilter) ||
                    (item.description && item.description.toLowerCase().includes(searchFilter)) ||
                    (item.summary && item.summary.toLowerCase().includes(searchFilter)) ||
                    (item.transcription && item.transcription.toLowerCase().includes(searchFilter));
                
                return matchesLanguage && matchesSourceType && matchesSearch;
            });
            
            renderDataset();
        }
        
        // Render the dataset
        function renderDataset() {
            const content = document.getElementById('content');
            
            if (filteredDataset.length === 0) {
                content.innerHTML = '<div class="no-results">No items match the current filters.</div>';
                return;
            }
            
            const grid = document.createElement('div');
            grid.className = 'dataset-grid';
            
            filteredDataset.forEach(item => {
                const itemDiv = document.createElement('div');
                itemDiv.className = 'dataset-item';
                
                itemDiv.innerHTML = `
                    <div class="item-id">${item.id}</div>
                    
                    <div class="item-meta">
                        <div class="source-type">${item.source_type.toUpperCase()}</div>
                        <div class="item-language">${item.language}</div>
                    </div>
                    
                    ${item.description ? `
                        <div class="item-description">
                            <strong>Description:</strong> ${item.description}
                        </div>
                    ` : ''}
                    
                    <div class="item-content">
                        <div class="preview-section">
                            <div class="preview-title">
                                ${getPreviewIcon(item.source_type)} Preview
                                <button class="copy-btn" onclick="copyToClipboard('${item.source.replace(/'/g, "\\'").replace(/"/g, '\\"')}', this)">📋 Copy URL</button>
                            </div>
                            <div class="source-preview">
                                ${renderPreview(item)}
                            </div>
                        </div>
                        
                        <div class="summary-section">
                            <div class="summary-title">Summary</div>
                            <div class="item-summary">
                                ${item.summary || 'No summary available'}
                            </div>
                        </div>
                    </div>
                    
                    ${item.transcription ? `
                        <div class="transcription-title">Transcription</div>
                        <div class="item-transcription">
                            ${item.transcription}
                        </div>
                    ` : ''}
                `;
                
                grid.appendChild(itemDiv);
            });
            
            content.innerHTML = '';
            content.appendChild(grid);
        }
        
        // Get preview icon based on source type
        function getPreviewIcon(sourceType) {
            const icons = {
                'audio': '🎵',
                'pdf': '📄',
                'youtube': '📺',
                'video': '🎬'
            };
            return icons[sourceType] || '📎';
        }
        
        // Render preview based on source type
        function renderPreview(item) {
            const source = item.source;
            
            if (item.source_type === 'audio') {
                if (source.startsWith('http')) {
                    return `
                        <audio controls style="width: 100%; margin-bottom: 10px;">
                            <source src="${source}" type="audio/mpeg">
                            Your browser does not support the audio element.
                        </audio>
                        <div><a href="${source}" target="_blank" class="source-link">${source}</a></div>
                    `;
                } else {
                    return `
                        <audio controls style="width: 100%; margin-bottom: 10px;">
                            <source src="${source}" type="audio/mpeg">
                            Your browser does not support the audio element.
                        </audio>
                        <div class="source-link">${source}</div>
                    `;
                }
            } else if (item.source_type === 'pdf') {
                return `
                    <div style="text-align: center; padding: 20px; border: 2px dashed #ddd; border-radius: 4px;">
                        📄 PDF Document
                    </div>
                    <div style="margin-top: 10px;">
                        <a href="${source}" target="_blank" class="source-link">${source}</a>
                    </div>
                `;
            } else if (item.source_type === 'youtube') {
                const videoId = extractYouTubeVideoId(source);
                if (videoId) {
                    return `
                        <iframe 
                            width="100%" 
                            height="200" 
                            src="https://www.youtube.com/embed/${videoId}" 
                            frameborder="0" 
                            allowfullscreen
                            style="border-radius: 4px;">
                        </iframe>
                        <div style="margin-top: 10px;">
                            <a href="${source}" target="_blank" class="source-link">${source}</a>
                        </div>
                    `;
                } else {
                    return `
                        <div style="text-align: center; padding: 20px; border: 2px dashed #ddd; border-radius: 4px;">
                            📺 YouTube Video
                        </div>
                        <div style="margin-top: 10px;">
                            <a href="${source}" target="_blank" class="source-link">${source}</a>
                        </div>
                    `;
                }
            } else {
                return `
                    <div style="text-align: center; padding: 20px; border: 2px dashed #ddd; border-radius: 4px;">
                        📎 ${item.source_type.toUpperCase()} File
                    </div>
                    <div style="margin-top: 10px;">
                        ${source.startsWith('http') ? 
                            `<a href="${source}" target="_blank" class="source-link">${source}</a>` : 
                            `<span class="source-link">${source}</span>`
                        }
                    </div>
                `;
            }
        }
        
        // Extract YouTube video ID from URL
        function extractYouTubeVideoId(url) {
            const regex = /(?:youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(?:mbed)?)\/|.*[?&]v=)|youtu\.be\/)([^"&?\/\s]{11})/;
            const match = url.match(regex);
            return match ? match[1] : null;
        }
        
        // Copy to clipboard function
        function copyToClipboard(text, buttonElement) {
            navigator.clipboard.writeText(text).then(() => {
                // Show success feedback
                const originalText = buttonElement.innerHTML;
                buttonElement.innerHTML = '✅ Copied!';
                buttonElement.style.background = '#28a745';
                setTimeout(() => {
                    buttonElement.innerHTML = originalText;
                    buttonElement.style.background = '#007bff';
                }, 2000);
            }).catch(() => {
                // Fallback for older browsers
                const textArea = document.createElement('textarea');
                textArea.value = text;
                document.body.appendChild(textArea);
                textArea.select();
                try {
                    document.execCommand('copy');
                    const originalText = buttonElement.innerHTML;
                    buttonElement.innerHTML = '✅ Copied!';
                    buttonElement.style.background = '#28a745';
                    setTimeout(() => {
                        buttonElement.innerHTML = originalText;
                        buttonElement.style.background = '#007bff';
                    }, 2000);
                } catch (err) {
                    alert('Failed to copy to clipboard');
                }
                document.body.removeChild(textArea);
            });
        }
        
        // Toggle content display
        function toggleContent(contentId) {
            const element = document.getElementById(contentId);
            const toggleButton = element.nextElementSibling;
            
            if (element.classList.contains('content-preview')) {
                element.classList.remove('content-preview');
                element.classList.add('content-full');
                element.querySelector('.fade-out')?.remove();
                toggleButton.textContent = 'Show less';
            } else {
                element.classList.remove('content-full');
                element.classList.add('content-preview');
                const fadeOut = document.createElement('div');
                fadeOut.className = 'fade-out';
                element.appendChild(fadeOut);
                toggleButton.textContent = 'Show more';
            }
        }
        
        // Event listeners
        document.getElementById('languageFilter').addEventListener('change', applyFilters);
        document.getElementById('sourceTypeFilter').addEventListener('change', applyFilters);
        document.getElementById('searchFilter').addEventListener('input', applyFilters);
        
        // Load dataset on page load
        window.addEventListener('load', loadDataset);
    </script>
</body>
</html>
